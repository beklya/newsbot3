# Persistence — обязательно для торгового сервиса
appendonly yes
appendfsync everysec        # Fsync раз в секунду — баланс speed/durability

# RDB — дополнительный snapshot раз в 5 минут
save 300 1

# Memory limits
maxmemory 2gb
maxmemory-policy noeviction  # Никогда не выкидываем сообщения молча!
                             # Если упёрлись — пусть лучше упадёт producer

# Persistence directory (отдельный SSD!)
dir D:/redis-data/

# Сеть — только localhost
bind 127.0.0.1
port 6379

# Logging
loglevel notice
logfile "D:/redis-data/redis.log"